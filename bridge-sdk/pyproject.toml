[project]
name = "bridge-sdk"
version = "0.1.0"
description = "Python client for The Bridge via Agent Adapter MCP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["python-dotenv>=1.0.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bridge_sdk*"]
