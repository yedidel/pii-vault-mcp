<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="ERD actions and workflows">
  <defs>
    <style>
      .title { font: 700 32px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Helvetica, Arial, sans-serif; fill: #64748b; }
      .table { font: 700 16px Helvetica, Arial, sans-serif; fill: #ffffff; }
      .pk { font: 600 13px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .col { font: 400 13px Helvetica, Arial, sans-serif; fill: #334155; }
      .type { font: 400 12px Helvetica, Arial, sans-serif; fill: #64748b; }
      .rel { font: 600 12px Helvetica, Arial, sans-serif; fill: #1e293b; }
      .note { font: 400 13px Helvetica, Arial, sans-serif; fill: #475569; }
      .footer { font: 400 12px Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .section { font: 700 13px Helvetica, Arial, sans-serif; fill: #64748b; letter-spacing: 0.04em; }
    </style>
    <marker id="crow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="48" y="48" class="title">ERD - Bridge Persistence</text>
  <text x="48" y="74" class="subtitle">JPA entities | tables actions + workflows | linked by request_id</text>

  <g transform="translate(80,120)">
    <rect width="420" height="44" rx="10" fill="#1d4ed8"/>
    <text x="20" y="28" class="table">actions</text>
    <rect y="44" width="420" height="420" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="20" y="72" class="pk">PK  request_id</text>
    <text x="280" y="72" class="type">String</text>
    <line x1="12" y1="84" x2="408" y2="84" stroke="#e2e8f0"/>
    <text x="20" y="112" class="col">agent_id</text>
    <text x="280" y="112" class="type">String</text>
    <line x1="12" y1="124" x2="408" y2="124" stroke="#f1f5f9"/>
    <text x="20" y="152" class="col">user_install_id</text>
    <text x="280" y="152" class="type">String</text>
    <line x1="12" y1="164" x2="408" y2="164" stroke="#f1f5f9"/>
    <text x="20" y="192" class="col">action_type</text>
    <text x="280" y="192" class="type">String</text>
    <line x1="12" y1="204" x2="408" y2="204" stroke="#f1f5f9"/>
    <text x="20" y="232" class="col">parameters_json</text>
    <text x="280" y="232" class="type">jsonb?</text>
    <line x1="12" y1="244" x2="408" y2="244" stroke="#f1f5f9"/>
    <text x="20" y="272" class="col">context_json</text>
    <text x="280" y="272" class="type">jsonb?</text>
    <line x1="12" y1="284" x2="408" y2="284" stroke="#f1f5f9"/>
    <text x="20" y="312" class="col">status</text>
    <text x="280" y="312" class="type">StatusType enum</text>
    <line x1="12" y1="324" x2="408" y2="324" stroke="#f1f5f9"/>
    <text x="20" y="352" class="col">result_data</text>
    <text x="280" y="352" class="type">text?</text>
    <line x1="12" y1="364" x2="408" y2="364" stroke="#f1f5f9"/>
    <text x="20" y="392" class="col">created_at</text>
    <text x="280" y="392" class="type">LocalDateTime</text>
    <line x1="12" y1="404" x2="408" y2="404" stroke="#f1f5f9"/>
    <text x="20" y="432" class="col">updated_at</text>
    <text x="280" y="432" class="type">LocalDateTime</text>
  </g>

  <g transform="translate(760,120)">
    <rect width="480" height="44" rx="10" fill="#0f766e"/>
    <text x="20" y="28" class="table">workflows</text>
    <rect y="44" width="480" height="460" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <text x="20" y="72" class="pk">PK  workflow_id</text>
    <text x="320" y="72" class="type">String</text>
    <line x1="12" y1="84" x2="468" y2="84" stroke="#e2e8f0"/>
    <text x="20" y="112" class="pk">UQ  request_id</text>
    <text x="320" y="112" class="type">String -&gt; actions</text>
    <line x1="12" y1="124" x2="468" y2="124" stroke="#e2e8f0"/>
    <text x="20" y="152" class="col">connector_type</text>
    <text x="320" y="152" class="type">ConnectorType</text>
    <line x1="12" y1="164" x2="468" y2="164" stroke="#f1f5f9"/>
    <text x="20" y="192" class="col">connector_context</text>
    <text x="320" y="192" class="type">String (URL...)</text>
    <line x1="12" y1="204" x2="468" y2="204" stroke="#f1f5f9"/>
    <text x="20" y="232" class="col">current_state</text>
    <text x="320" y="232" class="type">WorkflowState</text>
    <line x1="12" y1="244" x2="468" y2="244" stroke="#f1f5f9"/>
    <text x="20" y="272" class="col">current_step</text>
    <text x="320" y="272" class="type">WorkflowStep</text>
    <line x1="12" y1="284" x2="468" y2="284" stroke="#f1f5f9"/>
    <text x="20" y="312" class="col">context_json</text>
    <text x="320" y="312" class="type">jsonb?</text>
    <line x1="12" y1="324" x2="468" y2="324" stroke="#f1f5f9"/>
    <text x="20" y="352" class="col">created_at</text>
    <text x="320" y="352" class="type">LocalDateTime</text>
    <line x1="12" y1="364" x2="468" y2="364" stroke="#f1f5f9"/>
    <text x="20" y="392" class="col">updated_at</text>
    <text x="320" y="392" class="type">LocalDateTime</text>
    <line x1="12" y1="404" x2="468" y2="404" stroke="#f1f5f9"/>
    <text x="20" y="432" class="col">completed_at</text>
    <text x="320" y="432" class="type">LocalDateTime?</text>
    <line x1="12" y1="444" x2="468" y2="444" stroke="#f1f5f9"/>
    <text x="20" y="472" class="col">last_executed_command</text>
    <text x="320" y="472" class="type">String?</text>
  </g>

  <line x1="500" y1="250" x2="760" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#crow)"/>
  <text x="630" y="238" text-anchor="middle" class="rel">1 : 1</text>
  <text x="630" y="270" text-anchor="middle" class="rel">via request_id</text>

  <text x="48" y="640" class="section">NOTES FROM CODE</text>
  <text x="48" y="670" class="note">- ActionEntity = public action visible to the agent (status = Bridge.StatusType).</text>
  <text x="48" y="696" class="note">- WorkflowEntity = internal Bridge engine state (WorkflowState + WorkflowStep).</text>
  <text x="48" y="722" class="note">- No JPA @OneToOne annotation - logical 1:1 by unique workflows.request_id -&gt; actions.request_id.</text>
  <text x="48" y="748" class="note">- Adapter also keeps an in-memory pending_workflows map (not persisted) keyed by requestId.</text>
  <text x="48" y="774" class="note">- ConnectorType: POLLING | CHANNEL | THREAD | WEBHOOK - stored on workflows.connector_type.</text>
  <text x="48" y="800" class="note">- Only two persisted Bridge tables in this repo model package.</text>
  <text x="48" y="860" class="footer">Source: ActionEntity.kt | WorkflowEntity.kt</text>
</svg>
