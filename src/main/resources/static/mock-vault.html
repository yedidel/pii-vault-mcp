<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Vault - Pair Device</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f7f6;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: inline-block;
            max-width: 400px;
            width: 90%;
        }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover { background-color: #27ae60; }
        #message { margin-top: 20px; font-weight: 600; font-size: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔒 Secure Vault Link</h2>
    <p>Would you like to pair this mobile device with your AI Agent session?</p>

    <button onclick="approvePairing()">Approve & Bind Vault</button>

    <div id="message"></div>
</div>

<script>
    // Extract the pairing token from the URL query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function approvePairing() {
        const msgDiv = document.getElementById('message');
        msgDiv.style.color = "#34495e";
        msgDiv.innerText = "Connecting to bridge server...";

        try {
            // Hardcoded mock DID representing the secure hardware identity of this device
            const mockDid = "did:ethr:0x19E7E376E7C213B7E7e7e46cc70A5dD086DAff2A";

            // Send the verification request to the Kotlin Controller endpoint
            const response = await fetch(`/api/pairing/complete?token=${token}&did=${mockDid}`, {
                method: 'POST'
            });

            if (response.ok) {
                msgDiv.style.color = "#27ae60";
                msgDiv.innerText = "✅ Pairing completed successfully! You can now return to Claude.";
            } else {
                const errText = await response.text();
                msgDiv.style.color = "#c0392b";
                msgDiv.innerText = "❌ Pairing failed: " + errText;
            }
        } catch (e) {
            msgDiv.style.color = "#c0392b";
            msgDiv.innerText = "❌ Communication error: " + e.message;
        }
    }
</script>
</body>
</html>
