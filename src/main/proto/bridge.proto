syntax = "proto3";

package bridge;

//stream
service BridgeService {
  rpc SendAction (ActionRequest) returns (ActionResponse);
}

message ActionRequest {
  string agent_id = 1;
  string user_id=2;
  ActionType action = 3;
  string target_domain=4;
}

message ActionResponse {
  string request_id = 1;
  StatusType status = 2;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  LOGIN = 1;
  PAYMENT=2;
  CONFIRM = 3;
}

enum StatusType {
  STATUS_TYPE_UNSPECIFIED = 0;
  RECEIVED = 1;
  PENDING=2;
  REJECTED = 3;
}
