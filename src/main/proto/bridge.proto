syntax = "proto3";
package bridge;
import "google/protobuf/timestamp.proto";

service BridgeService {
  rpc SendAction (ActionRequest) returns (ActionResponse);
  rpc GetActionStatus (StatusRequest) returns (StatusResponse);
}
message ActionRequest {
  string agent_id = 1;
  string user_install_id = 2; //id that of app on specific device, used to send push notifications to the user
  string action_type = 3;
  map<string, string> parameters = 4;
  string platform=5;
  string session_id=6;
}
//answer to the initial request, with the generated UUID and initial status
message ActionResponse {
  string request_id = 1;
  StatusType status = 2;
  string description = 3;
}
//request to check the status of a specific action
message StatusRequest {
  string request_id = 1;
}
//response with the current status of the action and any relevant data
message StatusResponse {
  string request_id = 1;
  StatusType status = 2;
  string result_data = 3;
  google.protobuf.Timestamp updated_at = 4; //to indicate when the status was last updated, useful for clients to know if they should check again later
}
enum StatusType {
  STATUS_TYPE_UNSPECIFIED = 0;
  RECEIVED = 1;
  WAITING_FOR_USER = 2;
  IN_PROGRESS = 3;
  COMPLETED = 4;
  FAILED = 5;
  REJECTED = 6;
  EXPIRED = 7;
  FAILED_APP_NOT_INSTALLED = 8;
}